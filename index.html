<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Institutional Grievance Redressal Portal</title>
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #334155; margin: 0; padding: 20px; }
    .container { max-width: 650px; margin: 30px auto; }
    .card { background: var(--card); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 30px; }
    h2 { color: var(--primary); margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    label { font-weight: 600; font-size: 13px; color: #475569; display: block; margin-top: 12px; margin-bottom: 4px; }
    input, select, textarea, button { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; height: 100px; }
    button { background: var(--accent); color: white; border: none; font-weight: 600; margin-top: 20px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .hidden { display: none; }
    .status-box { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: 600; text-align: center; }
    .success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Submit a Grievance</h2>
      <form id="grievanceForm" onsubmit="handleFormSubmit(event)">
        
        <div class="row">
          <div>
            <label for="studentName">Full Name *</label>
            <input type="text" id="studentName" required placeholder="Enter full name">
          </div>
          <div>
            <label for="regNumber">Register Number *</label>
            <input type="text" id="regNumber" required placeholder="e.g. 311120104001">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="studentEmail">Official/Personal Email *</label>
            <input type="email" id="studentEmail" required placeholder="student@example.com">
          </div>
          <div>
            <label for="department">Department *</label>
            <select id="department" required>
              <option value="">Select Department</option>
              <option value="CSE">Computer Science & Engineering</option>
              <option value="ECE">Electronics & Communication</option>
              <option value="EEE">Electrical & Electronics</option>
              <option value="MECH">Mechanical Engineering</option>
              <option value="CIVIL">Civil Engineering</option>
              <option value="IT">Information Technology</option>
              <option value="AIDS">AI & Data Science</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="studentStatus">Student Status *</label>
            <select id="studentStatus" required onchange="toggleAlumniField()">
              <option value="Current Student">Current Student</option>
              <option value="Alumni">Alumni</option>
            </select>
          </div>
          <div id="passingYearContainer" class="hidden">
            <label for="passingYear">Year of Passing *</label>
            <input type="number" id="passingYear" placeholder="e.g. 2024" min="1990" max="2026">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="category">Grievance Category *</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Academic">Academic</option>
              <option value="Examinations">Examinations & Evaluation</option>
              <option value="Hostel & Food">Hostel & Food Services</option>
              <option value="Transport">Transport Facility</option>
              <option value="Infrastructure">Infrastructure & Labs</option>
              <option value="Finance & Fees">Finance & Fees</option>
              <option value="Disciplinary / Harassment">Disciplinary / Harassment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="urgency">Urgency Level *</label>
            <select id="urgency" required>
              <option value="Normal">Normal</option>
              <option value="Urgent">Urgent</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
        </div>

        <label for="description">Grievance Description *</label>
        <textarea id="description" required placeholder="Provide a detailed explanation of your issue..."></textarea>

        <label for="attachment">Attachment / Evidence (Optional - Max 5MB)</label>
        <input type="file" id="attachment" accept="image/*,.pdf,.doc,.docx">

        <button type="submit" id="submitBtn">Submit Grievance</button>
      </form>

      <div id="statusMessage" class="status-box hidden"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwl5jaRW9JWMO64231ZruLuaUkdhgEFkKZrA6rF4pk0mdH7BZPKl-G9cFHauP1rPDkZ/exec";

    function toggleAlumniField() {
      const status = document.getElementById("studentStatus").value;
      const yearContainer = document.getElementById("passingYearContainer");
      const passingYearInput = document.getElementById("passingYear");

      if (status === "Alumni") {
        yearContainer.classList.remove("hidden");
        passingYearInput.setAttribute("required", "true");
      } else {
        yearContainer.classList.add("hidden");
        passingYearInput.removeAttribute("required");
        passingYearInput.value = "";
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const statusMsg = document.getElementById("statusMessage");

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";
      statusMsg.className = "status-box hidden";

      try {
        let attachmentData = null;
        const fileInput = document.getElementById("attachment");

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          attachmentData = await convertFileToBase64(file);
        }

        const payload = {
          action: "SUBMIT_GRIEVANCE",
          studentName: document.getElementById("studentName").value.trim(),
          regNumber: document.getElementById("regNumber").value.trim(),
          studentEmail: document.getElementById("studentEmail").value.trim(),
          department: document.getElementById("department").value,
          studentStatus: document.getElementById("studentStatus").value,
          passingYear: document.getElementById("passingYear").value.trim() || "N/A",
          category: document.getElementById("category").value,
          urgency: document.getElementById("urgency").value,
          description: document.getElementById("description").value.trim(),
          attachment: attachmentData
        };

        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.result === "success") {
          statusMsg.innerText = `Grievance submitted successfully! Your Ticket ID is: ${result.ticketId}`;
          statusMsg.className = "status-box success";
          document.getElementById("grievanceForm").reset();
          toggleAlumniField();
        } else {
          throw new Error(result.message || "Failed to submit grievance.");
        }
      } catch (err) {
        statusMsg.innerText = `Error: ${err.message}`;
        statusMsg.className = "status-box error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Grievance";
      }
    }

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          base64: reader.result.split(',')[1],
          name: file.name,
          type: file.type
        });
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
