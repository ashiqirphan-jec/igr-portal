<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grievance Redressal Portal</title>
  <style>
    :root { --primary: #1e3a8a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 30px; margin-bottom: 20px; }
    h2 { color: var(--primary); margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background: var(--primary); }
    .tab-btn { background: #e2e8f0; color: #475569; padding: 10px 20px; width: auto; display: inline-block; margin-right: 5px; }
    .tab-btn.active { background: var(--primary); color: white; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; color: white; background: #64748b; }
    .status-RESOLVED { background: #16a34a; }
    .status-PENDING_HANDLER { background: #d97706; }
    .status-PENDING_ASSIGNMENT { background: #dc2626; }
    .hidden { display: none !important; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; background: #f1f5f9; padding: 15px; border-radius: 6px; margin-top: 15px; }
    .detail-item { font-size: 14px; }
    .detail-item strong { color: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <div style="margin-bottom: 20px;">
      <button type="button" class="tab-btn active" id="tabSubmitBtn" onclick="showTab('submit')">Submit Grievance</button>
      <button type="button" class="tab-btn" id="tabTrackBtn" onclick="showTab('track')">Track Grievance</button>
    </div>

    <!-- SUBMIT GRIEVANCE SECTION -->
    <div id="submitSection" class="card">
      <h2>Submit a Grievance</h2>
      <form id="grievanceForm">
        <div class="form-group"><label>Full Name (Optional)</label><input type="text" id="name"></div>
        
        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;"><label>Email Address (Optional)</label><input type="email" id="email"></div>
          <div class="form-group" style="flex: 1;"><label>Mobile No. (Optional)</label><input type="tel" id="mobile" placeholder="e.g. 9876543210"></div>
        </div>

        <div class="form-group"><label>Register Number (Optional)</label><input type="text" id="regNumber"></div>
        
        <!-- STUDENT TYPE SELECTION -->
        <div class="form-group">
          <label>Student Status</label>
          <select id="studentType" onchange="toggleStudentFields()" required>
            <option value="Current Student">Current Student</option>
            <option value="Alumni">Alumni</option>
          </select>
        </div>

        <!-- CURRENT STUDENT FIELDS -->
        <div id="currentStudentFields" style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>Year of Study</label>
            <select id="yearOfStudy" required>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Section</label>
            <select id="section" required>
              <option value="">Select Section</option>
              <option value="A">A</option><option value="B">B</option><option value="C">C</option>
              <option value="D">D</option><option value="E">E</option><option value="F">F</option>
              <option value="G">G</option><option value="H">H</option><option value="I">I</option>
              <option value="J">J</option><option value="K">K</option><option value="L">L</option>
              <option value="M">M</option><option value="N">N</option><option value="O">O</option>
            </select>
          </div>
        </div>

        <!-- ALUMNI FIELD -->
        <div id="alumniFields" class="form-group hidden">
          <label>Year of Passing</label>
          <input type="number" id="yearOfPassing" placeholder="e.g. 2024" min="1990" max="2026">
        </div>

        <!-- DEPARTMENT DROPDOWN -->
        <div class="form-group">
          <label>Department</label>
          <select id="department" required>
            <option value="">Select Department</option>
            <option value="CSE">Computer Science & Engineering</option>
            <option value="ECE">Electronics & Communication Engineering</option>
            <option value="EEE">Electrical & Electronics Engineering</option>
            <option value="MECH">Mechanical Engineering</option>
            <option value="CIVIL">Civil Engineering</option>
            <option value="IT">Information Technology</option>
            <option value="AIDS">Artificial Intelligence & Data Science</option>
            <option value="AIML">Artificial Intelligence & Machine Learning</option>
            <option value="S&H">Science & Humanities</option>
            <option value="OTHER">Other Department</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Category</label>
          <select id="category" required>
            <option value="Academic">Academic</option>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Hostel & Mess">Hostel & Mess</option>
            <option value="Examinations">Examinations</option>
            <option value="Other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Urgency Level</label>
          <select id="urgency" required>
            <option value="Normal">Normal</option>
            <option value="Urgent">Urgent</option>
            <option value="Critical">Critical</option>
          </select>
        </div>
        
        <div class="form-group"><label>Description</label><textarea id="description" rows="5" required></textarea></div>
        <div class="form-group"><label>Attachment (Optional)</label><input type="file" id="fileInput"></div>
        <button type="submit" id="submitBtn">Submit Ticket</button>
      </form>
    </div>

    <!-- TRACK TICKET SECTION -->
    <div id="trackSection" class="card hidden">
      <h2>Track Your Grievance</h2>
      <div class="form-group" style="display: flex; gap: 10px;">
        <input type="text" id="trackTicketId" placeholder="Enter Ticket ID (e.g., GRV-123456)">
        <button type="button" style="width: 150px;" onclick="trackTicket()">Track</button>
      </div>
      <div id="ticketResult" class="hidden" style="margin-top: 20px; border-top: 1px solid #cbd5e1; padding-top: 20px;">
        <h3>Ticket Details: <span id="resTicketId"></span></h3>
        <p><strong>Status:</strong> <span id="resStatus" class="badge"></span></p>

        <div class="detail-grid">
          <div class="detail-item"><strong>Assigned Advisor:</strong> <span id="resAdvisor">Not Assigned Yet</span></div>
          <div class="detail-item"><strong>Date Submitted:</strong> <span id="resTimestamp">N/A</span></div>
          <div class="detail-item"><strong>Category:</strong> <span id="resCategory"></span></div>
          <div class="detail-item"><strong>Department:</strong> <span id="resDept"></span></div>
          <div class="detail-item"><strong>Urgency Level:</strong> <span id="resUrgency">Normal</span></div>
          <div class="detail-item"><strong>Student Type:</strong> <span id="resStudentType">N/A</span></div>
        </div>

        <p style="margin-top: 15px;"><strong>Description:</strong></p>
        <div id="resDesc" style="background: #ffffff; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; font-size: 14px;"></div>

        <div id="resolutionBox" class="hidden" style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; border-radius: 6px; margin-top: 15px;">
          <h4 style="margin-top: 0; color: #166534;">Resolution Provided:</h4>
          <p id="resText"></p>
        </div>

        <div id="feedbackBox" class="hidden" style="margin-top: 20px;">
          <h4>Submit Resolution Feedback</h4>
          <textarea id="feedbackText" placeholder="Enter your feedback on how your grievance was handled..."></textarea>
          <button type="button" onclick="submitFeedback()" style="margin-top: 10px;">Submit Feedback</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwl5jaRW9JWMO64231ZruLuaUkdhgEFkKZrA6rF4pk0mdH7BZPKl-G9cFHauP1rPDkZ/exec";

    function showTab(tab) {
      document.getElementById("submitSection").classList.toggle("hidden", tab !== 'submit');
      document.getElementById("trackSection").classList.toggle("hidden", tab !== 'track');
      document.getElementById("tabSubmitBtn").classList.toggle("active", tab === 'submit');
      document.getElementById("tabTrackBtn").classList.toggle("active", tab === 'track');
    }

    function toggleStudentFields() {
      const type = document.getElementById("studentType").value;
      const currentFields = document.getElementById("currentStudentFields");
      const alumniFields = document.getElementById("alumniFields");
      const yearSelect = document.getElementById("yearOfStudy");
      const sectionSelect = document.getElementById("section");
      const passingYearInput = document.getElementById("yearOfPassing");

      if (type === "Alumni") {
        currentFields.classList.add("hidden");
        alumniFields.classList.remove("hidden");
        
        yearSelect.removeAttribute("required");
        sectionSelect.removeAttribute("required");
        passingYearInput.setAttribute("required", "true");
      } else {
        currentFields.classList.remove("hidden");
        alumniFields.classList.add("hidden");

        yearSelect.setAttribute("required", "true");
        sectionSelect.setAttribute("required", "true");
        passingYearInput.removeAttribute("required");
        passingYearInput.value = "";
      }
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const ticketId = urlParams.get('ticketId');
      if (ticketId) {
        showTab('track');
        document.getElementById('trackTicketId').value = ticketId;
        trackTicket();
      }
    };

    document.getElementById("grievanceForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").innerText = "Submitting...";

      const fileInput = document.getElementById("fileInput");
      let fileData = null;

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const base64 = await convertBase64(file);
        fileData = { fileName: file.name, mimeType: file.type, base64: base64 };
      }

      const studentType = document.getElementById("studentType").value;

      const payload = {
        action: "SUBMIT_GRIEVANCE",
        name: document.getElementById("name").value.trim() || "Anonymous / Unspecified",
        email: document.getElementById("email").value.trim() || "N/A",
        mobile: document.getElementById("mobile").value.trim() || "N/A",
        regNumber: document.getElementById("regNumber").value.trim() || "N/A",
        studentType: studentType,
        yearOfStudy: studentType === "Current Student" ? document.getElementById("yearOfStudy").value : "Alumni",
        section: studentType === "Current Student" ? document.getElementById("section").value : "N/A",
        yearOfPassing: studentType === "Alumni" ? document.getElementById("yearOfPassing").value : "N/A",
        department: document.getElementById("department").value,
        category: document.getElementById("category").value,
        urgency: document.getElementById("urgency").value,
        description: document.getElementById("description").value,
        fileData: fileData
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.result === "success") {
          alert("Grievance submitted successfully! Ticket ID: " + data.ticketId);
          document.getElementById("grievanceForm").reset();
          toggleStudentFields();
        } else {
          alert("Error: " + data.message);
        }
      } catch (err) { alert("Submission failed: " + err); }
      finally {
        document.getElementById("submitBtn").disabled = false;
        document.getElementById("submitBtn").innerText = "Submit Ticket";
      }
    });

    async function trackTicket() {
      const ticketId = document.getElementById("trackTicketId").value.trim();
      if (!ticketId) return alert("Please enter a Ticket ID.");

      const res = await fetch(`${API_URL}?action=TRACK_TICKET&ticketId=${ticketId}`);
      const data = await res.json();

      if (data.result === "success") {
        const t = data.ticket;
        document.getElementById("ticketResult").classList.remove("hidden");
        document.getElementById("resTicketId").innerText = t.ticketId || ticketId;
        document.getElementById("resStatus").innerText = t.status || "PENDING";
        document.getElementById("resStatus").className = `badge status-${t.status}`;
        document.getElementById("resAdvisor").innerText = t.advisor || t.handler || t.assignedTo || "Pending Assignment";
        document.getElementById("resTimestamp").innerText = t.timestamp ? new Date(t.timestamp).toLocaleString() : "N/A";
        document.getElementById("resCategory").innerText = t.category || "N/A";
        document.getElementById("resDept").innerText = t.department || "N/A";
        document.getElementById("resUrgency").innerText = t.urgency || "Normal";
        document.getElementById("resStudentType").innerText = t.studentType || "Current Student";
        document.getElementById("resDesc").innerText = t.description || "N/A";

        if (t.status === "RESOLVED") {
          document.getElementById("resolutionBox").classList.remove("hidden");
          document.getElementById("resText").innerText = t.resolutionText || "Resolution complete.";
          document.getElementById("feedbackBox").classList.remove("hidden");
        } else {
          document.getElementById("resolutionBox").classList.add("hidden");
          document.getElementById("feedbackBox").classList.add("hidden");
        }
      } else { alert("Ticket not found."); }
    }

    async function submitFeedback() {
      const ticketId = document.getElementById("resTicketId").innerText;
      const feedback = document.getElementById("feedbackText").value;
      if (!feedback) return alert("Please enter feedback.");

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "SUBMIT_FEEDBACK", ticketId: ticketId, feedback: feedback })
      });
      const data = await res.json();
      if (data.result === "success") alert("Thank you for your feedback!");
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
